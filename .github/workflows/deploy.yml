name: CI and Docker Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: npx prisma validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: npm run build

  docker:
    name: Build image (push on main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Fails if docker-compose.yml is invalid or a required setting is not declared.
      # Placeholder values only; the real ones live in the VPS .env file.
      - name: Validate docker-compose config
        env:
          DATABASE_URL: postgresql://user:pass@localhost:6543/postgres
          JWT_SECRET: ci-placeholder
          ENCRYPTION_KEY: ci-placeholder-32-characters-key
          OTP_SECRET: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: |
          docker network create web >/dev/null 2>&1 || true
          docker compose -f docker-compose.yml config --quiet
          for var in DATABASE_URL JWT_SECRET ENCRYPTION_KEY OTP_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_BILLS_BUCKET; do
            docker compose -f docker-compose.yml config | grep -q "$var:" || { echo "::error::$var is missing from docker-compose.yml"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only prove the image builds; main pushes publish it.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/travelogue:latest
            ghcr.io/${{ env.REPO_OWNER }}/travelogue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
