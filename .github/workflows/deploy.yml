name: CI and Docker Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: npx prisma validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: /api
        run: npm run build

  docker:
    name: Build image (push on main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Fails if docker-compose.yml is invalid or a required setting is not declared.
      # Placeholder values only; the real ones live in the VPS .env file.
      - name: Validate docker-compose config
        env:
          DATABASE_URL: postgresql://user:pass@localhost:6543/postgres
          JWT_SECRET: ci-placeholder
          ENCRYPTION_KEY: ci-placeholder-32-characters-key
          OTP_SECRET: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: |
          docker network create web >/dev/null 2>&1 || true
          docker compose -f docker-compose.yml config --quiet
          for var in DATABASE_URL JWT_SECRET ENCRYPTION_KEY OTP_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_BILLS_BUCKET; do
            docker compose -f docker-compose.yml config | grep -q "$var:" || { echo "::error::$var is missing from docker-compose.yml"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only prove the image builds; main pushes publish it.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/travelogue:latest
            ghcr.io/${{ env.REPO_OWNER }}/travelogue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [docker]
    # Only real pushes to main deploy; pull requests and manual runs on other branches never do.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      APP_URL: ${{ vars.APP_URL || 'https://travelogue.quana.ai' }}
    steps:
      - name: Skip when deploy secrets are not configured
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST secret is not set, skipping deploy. Add VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_APP_DIR to enable it."

      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''

      # Keep the server's compose file in step with main (its .env stays on the server).
      - name: Copy docker-compose.yml to the server
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_APP_DIR }}

      # Deploys the exact image built for this commit; roll back by re-running an older workflow run.
      - name: Pull the new image and restart
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull travelogue
            docker compose up -d --remove-orphans travelogue
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' travelogue 2>/dev/null || echo unknown)
              [ "$status" = healthy ] && break
              sleep 5
            done
            docker ps --filter name=travelogue --format '{{.Names}} {{.Image}} {{.Status}}'
            docker logs --tail 15 travelogue
            [ "$status" = healthy ] || { echo "Container did not become healthy"; exit 1; }
            docker image prune -f >/dev/null

      - name: Smoke test the live site
        if: env.VPS_HOST != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")
          echo "Home page: $code"; [ "$code" = 200 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/auth/me")
          echo "API without login (expect 401): $code"; [ "$code" = 401 ]
